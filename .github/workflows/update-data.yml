name: Update data

# Refreshes data.json (market snapshot + burn / cashback history read from Base)
# so the site never shows stale numbers. The page also reads the market and the
# contract directly; this keeps the history, totals and log current.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the chain and the market
        run: python scripts/update.py
      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update data.json"
          git push
